services:
  deepseek-auth:
    build:
      context: ./bridge
      dockerfile: Dockerfile.auth
    container_name: deepseek-auth
    volumes:
      - deepseek-session:/app/session
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      - DISPLAY=:99
      - RESOLUTION=1280x800x24
      - VNC_PASSWORD=password
      - PYTHONUNBUFFERED=1  # <-- логи в реальном времени
    tty: false
    stdin_open: false
    # После завершения скрипта контейнер просто останавливается (exit 0)

  deepseek-bridge:
    build:
      context: ./bridge
      dockerfile: Dockerfile.bridge
    container_name: deepseek-bridge
    restart: unless-stopped
    env_file:
      - ./bridge/.env
    depends_on:
      deepseek-auth:
        condition: service_completed_successfully   # ждём, пока auth завершится успешно
    volumes:
      - deepseek-session:/app/session
    environment:
      - SERVER_INTERACTIVE_LOGIN=0
      - HOST=0.0.0.0
    networks:
      - agent-net

  opencode:
    image: coderluii/holycode:1.2.5
    container_name: opencode-agent
    restart: unless-stopped
    depends_on:
      - deepseek-bridge
    volumes:
      - ./workspace:/workspace
      - ./configs:/root/.config/opencode   # <-- ОДНА точка
      - ./configs/git-config/.gitconfig:/root/.gitconfig
      - ./configs/git-config/.git-credentials:/root/.git-credentials
    working_dir: /workspace
    networks:
      - agent-net

volumes:
  deepseek-session:

networks:
  agent-net:
    driver: bridge